<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Footer de contacto — Persona 4</title>

<style>
  /* ============================================================
     FOOTER — Persona 4 (Contacto + JavaScript)
     Variables con prefijo --footer- para no chocar con el resto
     de estilos del sitio grupal.
     ============================================================ */

  :root {
    --footer-bg: #12151b;
    --footer-bg-elevated: #191d25;
    --footer-text: #e7e9ee;
    --footer-text-muted: #99a1b3;
    --footer-border: #262b35;
    --footer-accent: #5b8def;
    --footer-accent-hover: #7ea3f5;
    --footer-focus: #f2b134;
    --footer-radius: 10px;
    --footer-transition: 180ms ease;
  }

  /* Tema claro: se activa poniendo data-theme="light" en <html> */
  :root[data-theme="light"] {
    --footer-bg: #f6f7fa;
    --footer-bg-elevated: #ffffff;
    --footer-text: #1c2130;
    --footer-text-muted: #5b6478;
    --footer-border: #e1e4ea;
    --footer-accent: #3563d1;
    --footer-accent-hover: #274ea8;
    --footer-focus: #b5750f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--footer-bg);
    color: var(--footer-text);
    transition: background var(--footer-transition), color var(--footer-transition);
  }

  /* --- Footer --- */
  .site-footer {
    position: relative;
    background: var(--footer-bg);
    color: var(--footer-text);
    border-top: 1px solid var(--footer-border);
    padding: 3.5rem 1.5rem 1.5rem;
    transition: background var(--footer-transition), color var(--footer-transition);
  }

  .footer-container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.8fr 0.8fr;
    gap: 2.5rem;
  }

  @media (max-width: 860px) {
    .footer-container { grid-template-columns: 1fr; gap: 2rem; }
  }

  .footer-logo {
    font-weight: 700;
    font-size: 1.15rem;
    margin: 0 0 0.4rem;
  }

  .footer-tagline {
    color: var(--footer-text-muted);
    font-size: 0.92rem;
    line-height: 1.5;
    margin: 0 0 1.25rem;
    max-width: 32ch;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--footer-bg-elevated);
    color: var(--footer-text);
    border: 1px solid var(--footer-border);
    border-radius: 999px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color var(--footer-transition), transform var(--footer-transition);
  }
  .theme-toggle:hover { border-color: var(--footer-accent); }
  .theme-toggle:active { transform: scale(0.96); }
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }

  .footer-heading {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--footer-text-muted);
    margin: 0 0 1rem;
  }

  .footer-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .footer-link {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--footer-text);
    text-decoration: none;
    font-size: 0.94rem;
    transition: color var(--footer-transition), transform var(--footer-transition);
  }
  .footer-link .icon { color: var(--footer-text-muted); transition: color var(--footer-transition); }
  .footer-link:hover { color: var(--footer-accent-hover); transform: translateX(2px); }
  .footer-link:hover .icon { color: var(--footer-accent-hover); }

  .footer-link:focus-visible,
  .theme-toggle:focus-visible,
  .scroll-top:focus-visible {
    outline: 2px solid var(--footer-focus);
    outline-offset: 3px;
  }

  /* --- Lista del equipo: cada integrante con su GitHub y correo --- */
  .team-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem 1.75rem;
  }

  @media (max-width: 520px) {
    .team-list { grid-template-columns: 1fr; }
  }

  .team-member {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding: 0.75rem 0.9rem;
    background: var(--footer-bg-elevated);
    border: 1px solid var(--footer-border);
    border-radius: var(--footer-radius);
  }

  .team-name {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--footer-text);
  }

  .team-actions {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    flex-wrap: wrap;
  }

  .team-actions .footer-link {
    font-size: 0.85rem;
  }

  .copy-feedback {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--footer-accent);
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity var(--footer-transition), transform var(--footer-transition);
  }
  .copy-feedback.is-visible { opacity: 1; transform: translateY(0); }

  .footer-meta {
    max-width: 1200px;
    margin: 2.5rem auto 0;
    padding-top: 1.25rem;
    border-top: 1px solid var(--footer-border);
    color: var(--footer-text-muted);
    font-size: 0.8rem;
    text-align: center;
  }

  .scroll-top {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--footer-accent);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity var(--footer-transition), transform var(--footer-transition),
      visibility var(--footer-transition), background var(--footer-transition);
    z-index: 40;
  }
  .scroll-top.is-visible { opacity: 1; visibility: visible; transform: translateY(0); }
  .scroll-top:hover { background: var(--footer-accent-hover); }

  [data-animate] {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 500ms ease, transform 500ms ease;
  }
  [data-animate].is-visible { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .theme-toggle, .footer-link, .scroll-top, [data-animate], .copy-feedback {
      transition: none !important;
    }
  }
</style>
</head>

<script>
  /**
   * Lógica del footer — Persona 4 (Contacto + JavaScript)
   *   1. setCurrentYear   -> escribe el año actual en el footer
   *   2. initThemeToggle  -> alterna tema claro/oscuro y lo persiste
   *   3. initScrollTop    -> muestra/oculta y activa el botón "volver arriba"
   *   4. initScrollReveal -> anima elementos [data-animate] al entrar en viewport
   *   5. initCopyEmail    -> copia el correo de CADA integrante al portapapeles
   *   6. initSmoothAnchors-> scroll suave para los enlaces internos del footer
   *
   * Cada función revisa que su elemento exista antes de operar (defensive
   * coding), así este script no rompe páginas que no tengan el footer completo.
   */
  (function () {
    'use strict';

    const THEME_STORAGE_KEY = 'site-theme';

    function setCurrentYear() {
      const el = document.getElementById('current-year');
      if (!el) return;
      el.textContent = new Date().getFullYear();
    }

    function initThemeToggle() {
      const toggleBtn = document.getElementById('theme-toggle');
      const root = document.documentElement;
      if (!toggleBtn) return;

      const applyTheme = (theme) => {
        root.setAttribute('data-theme', theme);
        toggleBtn.setAttribute('aria-pressed', String(theme === 'light'));
        localStorage.setItem(THEME_STORAGE_KEY, theme);
      };

      const saved = localStorage.getItem(THEME_STORAGE_KEY);
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(saved || (prefersLight ? 'light' : 'dark'));

      toggleBtn.addEventListener('click', () => {
        const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        applyTheme(current === 'light' ? 'dark' : 'light');
      });
    }

    function initScrollTop() {
      const btn = document.getElementById('scroll-top');
      if (!btn) return;

      const SHOW_AFTER_PX = 400;
      let ticking = false;

      const updateVisibility = () => {
        const shouldShow = window.scrollY > SHOW_AFTER_PX;
        btn.classList.toggle('is-visible', shouldShow);
        ticking = false;
      };

      window.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(updateVisibility);
          ticking = true;
        }
      });

      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      updateVisibility();
    }

    function initScrollReveal() {
      const targets = document.querySelectorAll('[data-animate]');
      if (!targets.length) return;

      if (!('IntersectionObserver' in window)) {
        targets.forEach((el) => el.classList.add('is-visible'));
        return;
      }

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.15 }
      );

      targets.forEach((el) => observer.observe(el));
    }

    // Cada integrante tiene su propio enlace .copy-email y su propio
    // <span class="copy-feedback"> justo al lado (hermano dentro de
    // .team-actions), así que se buscan TODOS y cada uno se maneja por
    // separado en vez de depender de un único id fijo.
    function initCopyEmail() {
      const links = document.querySelectorAll('.copy-email');
      if (!links.length) return;

      links.forEach((link) => {
        link.addEventListener('click', async (event) => {
          const email = link.dataset.email;
          const feedback = link.closest('.team-actions')?.querySelector('.copy-feedback');
          if (!email || !navigator.clipboard) return; // deja el mailto: como fallback

          event.preventDefault();
          try {
            await navigator.clipboard.writeText(email);
            if (feedback) {
              feedback.textContent = 'Copiado';
              feedback.classList.add('is-visible');
              setTimeout(() => feedback.classList.remove('is-visible'), 1800);
            }
          } catch (err) {
            window.location.href = `mailto:${email}`;
          }
        });
      });
    }

    function initSmoothAnchors() {
      const anchors = document.querySelectorAll('.footer-anchor');
      anchors.forEach((anchor) => {
        anchor.addEventListener('click', (event) => {
          const targetId = anchor.getAttribute('href');
          const targetEl = targetId && document.querySelector(targetId);
          if (!targetEl) return;

          event.preventDefault();
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      setCurrentYear();
      initThemeToggle();
      initScrollTop();
      initScrollReveal();
      initCopyEmail();
      initSmoothAnchors();
    });
  })();
</script>
</body>
