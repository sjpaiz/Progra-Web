<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landing Page | Equipo</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- HU-1: Encabezado e inicio -->
    <header id="inicio">
        <!-- Aquí se desarrollará el navbar, nombre y lema del equipo -->
    </header>


    <main>

        <!-- HU-2: Integrantes -->
        <section id="equipo">
            <!-- Aquí se desarrollarán las tarjetas de los 5 integrantes -->
        </section>


        <!-- HU-3: Nuestro proyecto -->
        <section id="proyecto" aria-labelledby="proyecto-titulo">
            <div class="proyecto-contenido">
                <p class="proyecto-etiqueta">Qué hacemos</p>

                <h2 id="proyecto-titulo">Nuestro proyecto</h2>

                <p class="proyecto-descripcion">
                    Creamos una landing page para presentar a nuestro equipo de trabajo,
                    dar a conocer nuestro proyecto y facilitar que las personas puedan
                    conectar con nosotros.
                </p>

                <div class="proyecto-tecnologias" aria-labelledby="tecnologias-titulo">
                    <h3 id="tecnologias-titulo">Tecnologías</h3>

                    <ul class="lista-tecnologias" aria-label="Tecnologías utilizadas en el proyecto">
                        <li>HTML</li>
                        <li>CSS</li>
                        <li>JavaScript</li>
                        <li>Git</li>
                    </ul>
                </div>

                <!-- Quitar el atributo hidden y agregar el nombre para mostrar al dueño. -->
                <p class="proyecto-dueno" hidden>
                    <strong>Dueño:</strong> <span class="proyecto-dueno-nombre"></span>
                </p>
            </div>
        </section>

    </main>


    <!-- HU-4: Contacto -->
    <footer id="contacto">
        <!-- Aquí se desarrollarán los enlaces y datos de contacto -->
    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
